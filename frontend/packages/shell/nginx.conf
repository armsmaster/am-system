server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html не кэшируется: после выкладки браузер сразу видит новую версию.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # В именах файлов — хэш содержимого, их можно кэшировать навсегда.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Маршруты приложения (/admin, ...) обслуживает index.html.
    location / {
        try_files $uri /index.html;
    }
}
