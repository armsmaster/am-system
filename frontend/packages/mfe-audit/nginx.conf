server {
    listen 80;
    root /usr/share/nginx/html;

    # Манифест не кэшируется: по нему shell находит актуальную точку входа
    # remote (её имя содержит хэш), и новая версия видна сразу после выкладки.
    location = /mf-manifest.json {
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri =404;
    }
}
