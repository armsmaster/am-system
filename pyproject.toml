# Корень uv workspace: общие библиотеки (libs/*) и сервисы (services/*).
# Сам корень не пакет — он только собирает окружение разработки и хранит
# общие настройки инструментов.
[project]
name = "am-system"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "am-common",
    "am-quant",
    "audit",
    "booking",
    "marketdata",
    "portfolio",
    "reconciliation",
    "refdata",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "markdown>=3.7",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "testcontainers[postgres,redis]>=4.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
am-common = { workspace = true }
am-quant = { workspace = true }
audit = { workspace = true }
booking = { workspace = true }
marketdata = { workspace = true }
portfolio = { workspace = true }
reconciliation = { workspace = true }
refdata = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["libs/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "PT", "RET", "PL"]
# RUF001–003: кириллица в строках и комментариях — норма для этого проекта.
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
# Пакеты проверяются по одному (make py-types): у тестов разных пакетов
# одинаковые имена модулей (conftest, test_settings).
# Миграции исполняет Alembic по путям к файлам.
exclude = ["/migrations/", "/sample_migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "markdown.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты с настоящими Postgres/Redis в контейнерах (нужен Docker)"]

[tool.coverage.run]
branch = true
# Асинхронный SQLAlchemy переключает контексты через greenlet — без этого
# coverage теряет строки после await.
concurrency = ["greenlet", "thread"]
source = [
    "am_common",
    "am_quant",
    "audit",
    "booking",
    "marketdata",
    "portfolio",
    "reconciliation",
    "refdata",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
