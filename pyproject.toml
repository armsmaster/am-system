# Корень uv workspace: общие библиотеки (libs/*) и сервисы (services/*).
# Сам корень не пакет — он только собирает окружение разработки и хранит
# общие настройки инструментов.
[project]
name = "am-system"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["am-common", "portfolio"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
am-common = { workspace = true }
portfolio = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["libs/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "PT", "RET", "PL"]
# RUF001–003: кириллица в строках и комментариях — норма для этого проекта.
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["libs/am-common/src", "services/portfolio/src", "libs/am-common/tests", "services/portfolio/tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs/am-common/tests", "services/portfolio/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты с настоящими Postgres/Redis в контейнерах (нужен Docker)"]

[tool.coverage.run]
branch = true
source = ["am_common", "portfolio"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
