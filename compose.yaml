# Окружение: docker compose up -d --build
# Разработка — без .env: приложение на http://localhost:8080 (порт — GATEWAY_PORT).
# Виртуальная машина — .env от scripts/vm_config.py: свой домен, HTTPS, Keycloak
# в рабочем режиме, realm без пользователей разработки (README, «Развёртывание на ВМ»).
name: am-system

x-service-env: &service-env
  # Issuer — адрес realm, каким его видит браузер; ключи — по внутренней сети.
  AM_AUTH_ISSUER: ${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}/auth/realms/am
  AM_AUTH_JWKS_URL: http://keycloak:8080/auth/realms/am/protocol/openid-connect/certs
  AM_LOG_LEVEL: INFO
  AM_REDIS_URL: redis://redis:6379/0

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
  interval: 10s
  timeout: 3s
  retries: 10
  start_period: 20s

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
      SERVICES_DB_PASSWORD: ${SERVICES_DB_PASSWORD:-services-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      # По TCP: во время первичной инициализации Postgres слушает только
      # unix-сокет, и проверка через сокет сказала бы «готов» слишком рано.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d am"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    restart: unless-stopped
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.7.5
    # Разработка — start-dev; на ВМ — start: рабочий режим Keycloak.
    command: ${KEYCLOAK_MODE:-start-dev} --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
    volumes:
      # На ВМ — realm, собранный scripts/vm_config.py: свои секреты, без пользователей
      # разработки. Keycloak импортирует его только в пустую базу.
      - ${KEYCLOAK_REALM_DIR:-./infra/keycloak/realms}:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    restart: unless-stopped
    image: traefik:v3.7.16
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./infra/traefik:/etc/traefik:ro
    ports:
      # На ВМ шлюз слушает только 127.0.0.1: снаружи — HTTPS через tls. Docker публикует
      # порты в обход ufw, поэтому закрываем адресом, а не файрволом.
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:80"
      - "127.0.0.1:8081:8080"  # панель Traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  portfolio:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: portfolio
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_portfolio:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
      AM_KEYCLOAK_URL: http://keycloak:8080/auth
      AM_KEYCLOAK_CLIENT_SECRET: ${PORTFOLIO_KEYCLOAK_SECRET:-portfolio-dev-secret}
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  refdata:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: refdata
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_refdata:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  marketdata:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: marketdata
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_marketdata:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
      # Справочник читаем под служебной учётной записью am-marketdata.
      AM_KEYCLOAK_URL: http://keycloak:8080/auth
      AM_KEYCLOAK_CLIENT_SECRET: ${MARKETDATA_KEYCLOAK_SECRET:-marketdata-dev-secret}
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  booking:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: booking
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_booking:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
      # Справочник и рыночные данные читаем под служебной учётной записью am-booking.
      AM_KEYCLOAK_URL: http://keycloak:8080/auth
      AM_KEYCLOAK_CLIENT_SECRET: ${BOOKING_KEYCLOAK_SECRET:-booking-dev-secret}
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  reconciliation:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: reconciliation
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_reconciliation:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
      # День закрываем в booking под служебной учётной записью am-reconciliation.
      AM_KEYCLOAK_URL: http://keycloak:8080/auth
      AM_KEYCLOAK_CLIENT_SECRET: ${RECONCILIATION_KEYCLOAK_SECRET:-reconciliation-dev-secret}
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  limits:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: limits
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_limits:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
      # Данные фонда для проверки сделки трейдера портфеля — под учётной записью am-limits.
      AM_KEYCLOAK_URL: http://keycloak:8080/auth
      AM_KEYCLOAK_CLIENT_SECRET: ${LIMITS_KEYCLOAK_SECRET:-limits-dev-secret}
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  audit:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: audit
    environment:
      <<: *service-env
      AM_DATABASE_URL: postgresql+asyncpg://svc_audit:${SERVICES_DB_PASSWORD:-services-dev}@postgres:5432/am
    depends_on: *service-depends
    healthcheck: *service-healthcheck

  shell:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/shell/Dockerfile

  mfe-admin:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-admin/Dockerfile

  mfe-audit:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-audit/Dockerfile

  mfe-refdata:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-refdata/Dockerfile

  mfe-marketdata:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-marketdata/Dockerfile

  mfe-booking:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-booking/Dockerfile

  mfe-reconciliation:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-reconciliation/Dockerfile

  mfe-limits:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: packages/mfe-limits/Dockerfile

  # HTTPS на ВМ: Caddy получает сертификат Let's Encrypt для DOMAIN и проксирует
  # на шлюз. Включается профилем tls (COMPOSE_PROFILES=tls в .env).
  tls:
    restart: unless-stopped
    image: caddy:2.10.2-alpine
    profiles: [tls]
    environment:
      # Задаёт scripts/vm_config.py; без них Caddy не запустится и скажет об этом в логе.
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${TLS_HTTP_PORT:-80}:80"
      - "${TLS_HTTPS_PORT:-443}:443"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
