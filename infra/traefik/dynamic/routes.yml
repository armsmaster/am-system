# Всё приложение живёт на одном адресе (origin): фронтенд, API и Keycloak.
# Поэтому браузеру не нужен CORS, а токен не уходит на сторонние адреса.
#
#   /auth/...        → Keycloak
#   /api/<сервис>/.. → сервис (префикс срезается)
#   /mfe/<имя>/...   → статика микрофронтенда (префикс срезается)
#   /...             → shell
http:
  routers:
    keycloak:
      rule: PathPrefix(`/auth`)
      service: keycloak
      entryPoints: [web]

    portfolio-api:
      rule: PathPrefix(`/api/portfolio`)
      middlewares: [strip-portfolio]
      service: portfolio
      entryPoints: [web]

    refdata-api:
      rule: PathPrefix(`/api/refdata`)
      middlewares: [strip-refdata]
      service: refdata
      entryPoints: [web]

    audit-api:
      rule: PathPrefix(`/api/audit`)
      middlewares: [strip-audit]
      service: audit
      entryPoints: [web]

    mfe-admin:
      rule: PathPrefix(`/mfe/admin`)
      middlewares: [strip-mfe-admin]
      service: mfe-admin
      entryPoints: [web]

    mfe-refdata:
      rule: PathPrefix(`/mfe/refdata`)
      middlewares: [strip-mfe-refdata]
      service: mfe-refdata
      entryPoints: [web]

    mfe-audit:
      rule: PathPrefix(`/mfe/audit`)
      middlewares: [strip-mfe-audit]
      service: mfe-audit
      entryPoints: [web]

    shell:
      rule: PathPrefix(`/`)
      priority: 1
      service: shell
      entryPoints: [web]

  middlewares:
    strip-portfolio:
      stripPrefix:
        prefixes: ["/api/portfolio"]
    strip-refdata:
      stripPrefix:
        prefixes: ["/api/refdata"]
    strip-audit:
      stripPrefix:
        prefixes: ["/api/audit"]
    strip-mfe-admin:
      stripPrefix:
        prefixes: ["/mfe/admin"]
    strip-mfe-audit:
      stripPrefix:
        prefixes: ["/mfe/audit"]
    strip-mfe-refdata:
      stripPrefix:
        prefixes: ["/mfe/refdata"]

  services:
    keycloak:
      loadBalancer:
        servers: [{ url: "http://keycloak:8080" }]
    portfolio:
      loadBalancer:
        servers: [{ url: "http://portfolio:8000" }]
        healthCheck:
          path: /health
          interval: 10s
    refdata:
      loadBalancer:
        servers: [{ url: "http://refdata:8000" }]
        healthCheck:
          path: /health
          interval: 10s
    audit:
      loadBalancer:
        servers: [{ url: "http://audit:8000" }]
        healthCheck:
          path: /health
          interval: 10s
    mfe-admin:
      loadBalancer:
        servers: [{ url: "http://mfe-admin:80" }]
    mfe-audit:
      loadBalancer:
        servers: [{ url: "http://mfe-audit:80" }]
    mfe-refdata:
      loadBalancer:
        servers: [{ url: "http://mfe-refdata:80" }]
    shell:
      loadBalancer:
        servers: [{ url: "http://shell:80" }]
