[project]
name = "refdata"
version = "0.1.0"
description = "Справочник инструментов: бумаги и их версии, графики платежей, календарь, синхронизация с MOEX ISS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "am-common",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
am-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refdata"]
