[project]
name = "marketdata"
version = "0.1.0"
description = "Рыночные данные: цены от скрипта и из MOEX ISS, OHLC и DEMA, ручные цены, цена для оценки, НКД и номинал на дату"
requires-python = ">=3.13,<3.14"
dependencies = [
    "am-common",
    "am-quant",
    "defusedxml>=0.7.1",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
am-common = { workspace = true }
am-quant = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketdata"]
