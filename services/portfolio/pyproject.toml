[project]
name = "portfolio"
version = "0.1.0"
description = "Сервис портфелей: граф compound/physical, фонды, счета, права доступа"
requires-python = ">=3.13,<3.14"
dependencies = [
    "am-common",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
am-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]
