[project]
name = "booking"
version = "0.1.0"
description = "Сделки, события по бумагам, позиции по двум датам, деньги, дневной ролл и пересчёт задним числом"
requires-python = ">=3.13,<3.14"
dependencies = [
    "am-common",
    "am-quant",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
am-common = { workspace = true }
am-quant = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking"]
