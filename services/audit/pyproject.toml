[project]
name = "audit"
version = "0.1.0"
description = "Журнал действий пользователей: принимает события всех сервисов и хранит их без права изменения"
requires-python = ">=3.13,<3.14"
dependencies = [
    "am-common",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
am-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]
